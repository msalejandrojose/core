# Configuración NO secreta de la API en Cloud Run (servicio brio-api). Se
# commitea y se aplica con `terraform apply` (infra/terraform/envs/brio-dev). Los secretos
# (BBDD, JWT, R2, OpenAI, Google) van en Secret Manager: ver deploy/README.md.
NODE_ENV: production
LOG_LEVEL: info
THROTTLE_TTL_MS: "60000"
THROTTLE_LIMIT: "120"
JWT_EXPIRES_IN: 60m
MAIL_FROM: "Brío <noreply@example.com>"
APP_URL: https://brio-api.ajly.online
# Issuer de OAuth/MCP: detrás del Worker de Cloudflare la API no puede deducir
# el host público de la petición (trust proxy solo confía en un salto).
OAUTH_ISSUER_URL: https://brio-api.ajly.online
# Vuelta de Google en el login desde navegador (pantalla de autorizar un conector
# MCP, Godot). Debe estar en las URIs de redirección del cliente OAuth web
# («Racing Web», proyecto core-502518).
GOOGLE_OAUTH_REDIRECT_URI: https://brio-api.ajly.online/v1/auth/google/callback
# El .env de secretos que monta Cloud Run desde Secret Manager.
ENV_FILE: /secrets/.env
# Fotos y archivos en Cloudflare R2 (S3 compatible). Endpoint y claves, en secretos.
STORAGE_DRIVER: S3
STORAGE_S3_BUCKET: brio-fotos
STORAGE_S3_REGION: auto
STORAGE_S3_FORCE_PATH_STYLE: "true"
STORAGE_RAW_TOKEN_TTL_SECONDS: "300"
STORAGE_VIEW_TOKEN_TTL_SECONDS: "3600"
# La app nativa (Capacitor), el backoffice en Cloudflare Pages y, para probar, la web y el backoffice del Mac por ZeroTier.
CORS_ORIGINS: capacitor://localhost,https://brio-backoffice.pages.dev,http://localhost,https://localhost,http://172.28.185.230:4410,http://172.28.185.230:4420,http://localhost:4400,http://localhost:5174
# Actualizaciones en caliente (OTA): zips que se guardan por app y canal en R2.
OTA_KEEP_BUNDLES: "5"
