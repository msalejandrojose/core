# Construye la imagen de la API (contexto = raíz del monorepo) y la sube a
# Artifact Registry. La lanza deploy/deploy.sh con `gcloud builds submit`.
#
# Es la única imagen: la usan el servicio brio-api y, con otro comando, los
# jobs brio-api-migrate (`prisma migrate deploy`) y brio-api-seed.
steps:
  - id: image
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-f', 'apps/api/Dockerfile', '--target', 'runtime', '-t', '${_IMAGE}', '.']
images:
  - '${_IMAGE}'
options:
  logging: CLOUD_LOGGING_ONLY
