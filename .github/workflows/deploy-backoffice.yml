name: Deploy Brío backoffice

# Build + deploy del backoffice (React + Vite, SPA estática) a Cloudflare Pages
# al hacer push a `brio-dev` (lo que entra al fusionar un PR de tarea) si toca
# el backoffice o sus paquetes. También se puede lanzar a mano desde Actions.
#
# - Apunta a la API de Brío en Cloud Run (VITE_API_URL, se fija al compilar).
# - Si el proyecto de Pages no existe, lo crea (con `brio-dev` como rama de
#   producción). Usa los mismos secretos que la web: CLOUDFLARE_API_TOKEN (con
#   permiso «Cloudflare Pages: Edit») y CLOUDFLARE_ACCOUNT_ID.
# - Rutas de la SPA: Pages sirve index.html en cualquier ruta desconocida porque
#   el build no tiene un 404.html, así que no hace falta `_redirects`.
# - El origen de Pages tiene que estar en CORS_ORIGINS de la API
#   (apps/api/deploy/cloudrun.env.yaml).
#
# Cuando la infra pase a `main` (tarea en Notion), cambiar la rama del trigger,
# la de `--branch` y la rama de producción del proyecto en Cloudflare.
on:
  push:
    branches: [brio-dev]
    paths:
      - 'apps/backoffice/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-backoffice.yml'
  workflow_dispatch:

# Es un sitio estático: si entra un push nuevo, el despliegue anterior sobra.
concurrency:
  group: deploy-brio-backoffice
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_PROJECT_NAME: brio-backoffice
  PRODUCTION_BRANCH: brio-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        # Solo para sacar el OpenAPI del que se generan los tipos del cliente.
        run: pnpm build:api

      - name: Generate OpenAPI spec (offline, sin DB)
        run: node apps/api/dist/generate-openapi.js "$GITHUB_WORKSPACE/openapi.json"

      - name: Generate api-client schema
        run: >-
          pnpm --filter @core/api-client exec openapi-typescript
          "$GITHUB_WORKSPACE/openapi.json"
          --default-non-nullable false
          -o "$GITHUB_WORKSPACE/packages/api-client/src/generated/schema.d.ts"

      - name: Type-check + build backoffice
        run: pnpm build:backoffice
        env:
          # Las variables del proceso pisan las de apps/backoffice/.env (localhost).
          VITE_API_URL: https://brio-api.ajly.online

      - name: Create Cloudflare Pages project (si no existe)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if pnpm exec wrangler pages project list | grep -qw "$CLOUDFLARE_PROJECT_NAME"; then
            echo "El proyecto $CLOUDFLARE_PROJECT_NAME ya existe."
          else
            pnpm exec wrangler pages project create "$CLOUDFLARE_PROJECT_NAME" \
              --production-branch="$PRODUCTION_BRANCH"
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --branch = rama de producción del proyecto → despliegue de PRODUCCIÓN.
        run: >-
          pnpm exec wrangler pages deploy apps/backoffice/dist
          --project-name="$CLOUDFLARE_PROJECT_NAME"
          --branch="$PRODUCTION_BRANCH"
          --commit-dirty=true
