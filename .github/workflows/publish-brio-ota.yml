name: Publish Brío OTA

# Publica la web de la app de Brío como actualización en caliente (OTA) al hacer
# push a `brio-dev` (lo que entra al fusionar un PR) si toca la app. Es lo mismo
# que `pnpm --filter @core/mobile ota:publish` en el Mac (apps/mobile/ota/README.md):
#   1. ¿Se puede publicar? (scripts/ota-ci-check.sh: nada nativo sin subir
#      minNativeVersion desde la última OTA, ni «[skip ota]» en el commit);
#   2. tests de la app;
#   3. si el mismo push despliega la API, espera a que acabe bien (la web nueva
#      puede usar endpoints nuevos);
#   4. `ota:publish`: type-check + build, zip, cifrado/firma y subida a la API;
#   5. apunta este commit como la última OTA: un despliegue de GitHub en el
#      entorno `ota-<appId>` (la base del paso 1). No es una etiqueta porque el
#      GITHUB_TOKEN no puede crear refs que apunten a commits con cambios en
#      .github/workflows/ que no estén en main.
#
# La clave de firma NO está en GitHub: está en GCP Secret Manager y se lee al
# vuelo con Workload Identity Federation, con la misma cuenta que despliega la
# API (secretos GCP_WIF_PROVIDER / GCP_DEPLOY_SA, que no son claves). Una sola
# clave sirve para todas las apps. Puesta en marcha: apps/mobile/ota/setup-gcp.sh.
on:
  push:
    branches: [brio-dev]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/publish-brio-ota.yml'
  workflow_dispatch:
    inputs:
      notes:
        description: Qué lleva (sale en el backoffice)
        required: false

# Una publicación detrás de otra.
concurrency:
  group: publish-brio-ota
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write # apuntar la última OTA (entorno ota-<appId>)
  actions: read # ver si el despliegue de la API ha acabado
  id-token: write # Workload Identity Federation (GCP)

env:
  GCP_PROJECT: core-502518
  OTA_KEY_SECRET: ota-signing-key
  OTA_LOGIN_SECRET: ota-publisher-login

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check what can go over the air
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          app_id="$(node -p "require('./apps/mobile/ota/config.json').appId")"
          environment="ota-$app_id"
          echo "environment=$environment" >>"$GITHUB_OUTPUT"
          # La última OTA publicada es el último despliegue de ese entorno.
          last="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$environment&per_page=1" --jq '.[0].sha // empty')"
          base="${last:-${BEFORE:-0}}"
          echo "Base: $base"
          apps/mobile/scripts/ota-ci-check.sh "$base" "$GITHUB_SHA" | tee "$RUNNER_TEMP/check.txt"
          if grep -q '^No se publica' "$RUNNER_TEMP/check.txt"; then
            echo "::warning title=OTA no publicada::$(grep '^No se publica' "$RUNNER_TEMP/check.txt")"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.publish == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.publish == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build API
        # `prebuild` ejecuta `prisma generate`; hace falta para el OpenAPI.
        if: steps.check.outputs.publish == 'true'
        run: pnpm build:api

      - name: Generate api-client schema
        if: steps.check.outputs.publish == 'true'
        run: |
          node apps/api/dist/generate-openapi.js "$RUNNER_TEMP/openapi.json"
          pnpm --filter @core/api-client exec openapi-typescript \
            "$RUNNER_TEMP/openapi.json" \
            --default-non-nullable false \
            -o "$GITHUB_WORKSPACE/packages/api-client/src/generated/schema.d.ts"

      - name: Test mobile
        if: steps.check.outputs.publish == 'true'
        run: pnpm --filter @core/mobile test

      - name: Wait for the API deploy of this commit
        if: steps.check.outputs.publish == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 120); do
            run="$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy-brio-api.yml \
              --commit "$GITHUB_SHA" --json status,conclusion \
              --jq '.[0] // empty | "\(.status) \(.conclusion)"')"
            if [ -z "$run" ]; then
              # Sin despliegue de la API para este commit (no la toca): adelante.
              [ "$i" -ge 3 ] && { echo "Este push no despliega la API."; exit 0; }
            elif [ "${run%% *}" = completed ]; then
              [ "${run#* }" = success ] && { echo "API desplegada."; exit 0; }
              echo "::error::El despliegue de la API ha fallado (${run#* }): no se publica la OTA."
              exit 1
            else
              echo "Esperando al despliegue de la API ($run)…"
            fi
            sleep 15
          done
          echo "::error::El despliegue de la API no ha acabado en 30 min."
          exit 1

      - uses: google-github-actions/auth@v2
        if: steps.check.outputs.publish == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      # El runner ya trae gcloud: usarlo ahorra la descarga (~15 s).
      - name: Check preinstalled gcloud
        id: gcloud
        if: steps.check.outputs.publish == 'true'
        run: echo "installed=$(command -v gcloud >/dev/null && echo true || echo false)" >>"$GITHUB_OUTPUT"

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.check.outputs.publish == 'true'
        with:
          skip_install: ${{ steps.gcloud.outputs.installed }}

      - name: Read signing key and publisher login (Secret Manager)
        if: steps.check.outputs.publish == 'true'
        run: |
          umask 077
          gcloud secrets versions access latest --project "$GCP_PROJECT" \
            --secret "$OTA_KEY_SECRET" >"$RUNNER_TEMP/ota-private.pem"
          # ota-publisher-login: dos líneas OTA_EMAIL=… y OTA_PASSWORD=…
          login="$(gcloud secrets versions access latest --project "$GCP_PROJECT" --secret "$OTA_LOGIN_SECRET")"
          email="$(sed -n 's/^OTA_EMAIL=//p' <<<"$login")"
          password="$(sed -n 's/^OTA_PASSWORD=//p' <<<"$login")"
          if [ -z "$email" ] || [ -z "$password" ]; then
            echo "::error::El secreto $OTA_LOGIN_SECRET tiene que tener las líneas OTA_EMAIL=… y OTA_PASSWORD=…"
            exit 1
          fi
          echo "::add-mask::$password"
          { echo "OTA_EMAIL=$email"; echo "OTA_PASSWORD=$password"; } >>"$GITHUB_ENV"

      - name: Publish OTA
        if: steps.check.outputs.publish == 'true'
        working-directory: apps/mobile
        env:
          VITE_API_URL: https://brio-api.ajly.online
          OTA_PRIVATE_KEY_PATH: ${{ runner.temp }}/ota-private.pem
          # Por variable de entorno, nunca interpolado en el script.
          INPUT_NOTES: ${{ github.event.inputs.notes }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          notes="${INPUT_NOTES:-${COMMIT_MESSAGE%%$'\n'*}}"
          notes="${notes:-$(git log -1 --format=%s)}"
          pnpm ota:publish --notes "$notes (${GITHUB_SHA::7})" </dev/null

      - name: Mark this commit as the last OTA
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ steps.check.outputs.environment }}
        run: |
          # Un despliegue de GitHub y no una etiqueta: el GITHUB_TOKEN no puede
          # crear refs a commits con cambios en .github/workflows/ fuera de main.
          id="$(gh api "repos/$GITHUB_REPOSITORY/deployments" \
            -f ref="$GITHUB_SHA" -f environment="$ENVIRONMENT" \
            -f description="OTA publicada" -F auto_merge=false \
            -F 'required_contexts[]' --jq .id)"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state=success -F auto_inactive=true >/dev/null
          echo "Última OTA: $GITHUB_SHA (despliegue $id en $ENVIRONMENT)."

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ota-private.pem"
