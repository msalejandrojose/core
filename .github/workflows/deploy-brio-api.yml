name: Deploy Brío API

# Despliegue de la API de Brío en Cloud Run al hacer push a `brio-dev` (lo que
# entra al fusionar un PR de tarea) si toca la API o sus paquetes. Pasos:
#   1. tests de la API;
#   2. `deploy.sh ci`: construye las imágenes en Cloud Build, aplica las
#      migraciones con el job `brio-api-migrate` y, si van bien, despliega.
# Si una migración falla, no se despliega y sigue la versión anterior.
#
# Se autentica en GCP sin claves, con Workload Identity Federation: hace falta
# configurarlo una vez con apps/api/deploy/setup-github-deploy.sh, que deja los
# secretos GCP_WIF_PROVIDER y GCP_DEPLOY_SA en el repo. Ver deploy/README.md.
on:
  push:
    branches: [brio-dev]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-brio-api.yml'
  workflow_dispatch:

# Un despliegue detrás de otro, nunca dos migraciones a la vez.
concurrency:
  group: deploy-brio-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @core/api prisma:generate

      - name: Build workspace packages
        # La API importa el dist/ de @core/shared-types (y demás paquetes internos):
        # sin compilarlos, jest no encuentra el módulo.
        run: pnpm --filter "@core/api^..." build

      - name: Test API
        run: pnpm --filter @core/api test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build, migrate and deploy
        run: apps/api/deploy/deploy.sh ci
