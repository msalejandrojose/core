name: Deploy Brío API

# Despliegue de la API de Brío en Cloud Run al hacer push a `brio-dev` (lo que
# entra al fusionar un PR de tarea) si toca la API o sus paquetes. Pasos:
#   1. a la vez: tests de la API y `deploy.sh build`: la base de dependencias
#      api-deps (solo si han cambiado), compilar la API aquí y montar la imagen
#      (base + dist/) en Cloud Build; la misma imagen para el servicio y los jobs
#      de migraciones y seed;
#   2. si las dos cosas van bien, `deploy.sh release`: el job de migraciones
#      `brio-api-migrate` (solo si hay migraciones nuevas desde lo desplegado)
#      y el despliegue.
# Si fallan los tests o una migración, no se despliega y sigue la versión
# anterior (la imagen de un build que no se despliega se queda en Artifact
# Registry y la borra la limpieza).
#
# Se autentica en GCP sin claves, con Workload Identity Federation: hace falta
# configurarlo una vez con apps/api/deploy/setup-github-deploy.sh, que deja los
# secretos GCP_WIF_PROVIDER y GCP_DEPLOY_SA en el repo. Ver deploy/README.md.
on:
  push:
    branches: [brio-dev]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-brio-api.yml'
  workflow_dispatch:
    inputs:
      force_migrate:
        description: Ejecutar el job de migraciones aunque no haya migraciones nuevas
        type: boolean
        default: false
      force_deps:
        description: Reconstruir la base de dependencias aunque no hayan cambiado
        type: boolean
        default: false

# Un despliegue detrás de otro, nunca dos migraciones a la vez.
concurrency:
  group: deploy-brio-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # La misma etiqueta de imagen en el job de build y en el de release.
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @core/api prisma:generate

      - name: Build workspace packages
        # La API importa el dist/ de @core/shared-types (y demás paquetes internos):
        # sin compilarlos, jest no encuentra el módulo.
        run: pnpm --filter "@core/api^..." build

      - name: Test API
        run: pnpm --filter @core/api test

  # En paralelo con los tests: si fallan, las imágenes se quedan sin desplegar.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El código se compila aquí; la imagen es la base de dependencias
      # (api-deps, solo se reconstruye si cambian) + dist/.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @core/api...

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      # El runner ya trae gcloud: usarlo ahorra la descarga (~15 s).
      - name: Check preinstalled gcloud
        id: gcloud
        run: echo "installed=$(command -v gcloud >/dev/null && echo true || echo false)" >>"$GITHUB_OUTPUT"

      - uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: ${{ steps.gcloud.outputs.installed }}

      - name: Build and push image
        env:
          FORCE_DEPS: ${{ inputs.force_deps && '1' || '' }}
        run: apps/api/deploy/deploy.sh build

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: para comparar las migraciones con el commit desplegado.
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      # El runner ya trae gcloud: usarlo ahorra la descarga (~15 s).
      - name: Check preinstalled gcloud
        id: gcloud
        run: echo "installed=$(command -v gcloud >/dev/null && echo true || echo false)" >>"$GITHUB_OUTPUT"

      - uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: ${{ steps.gcloud.outputs.installed }}

      - name: Migrate (if needed) and deploy
        env:
          FORCE_MIGRATE: ${{ inputs.force_migrate && '1' || '' }}
        run: apps/api/deploy/deploy.sh release
